spring:
  datasource:
    url: ${BDIS_DB_URL:jdbc:mysql://localhost:3306/bdis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${BDIS_DB_USERNAME:root}
    password: ${BDIS_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  mail:
    host: ${BDIS_MAIL_HOST:smtp.163.com}
    port: ${BDIS_MAIL_PORT:465}
    username: ${BDIS_MAIL_USERNAME:}
    password: ${BDIS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.from: ${spring.mail.username}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

mail:
  recipient: ${BDIS_MAIL_RECIPIENT:18862028557@163.com}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bdis.bdis_website.entity  # 确保包路径与你的项目一致
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${BDIS_JWT_SECRET:bdis-local-dev-only-change-before-production}
  expiration: ${BDIS_JWT_EXPIRATION:86400000}

feedback:
  storage-root: ${BDIS_FEEDBACK_STORAGE_ROOT:./private-feedback}
  recipient: ${BDIS_FEEDBACK_RECIPIENT:18862028557@163.com}

upload:
  path: ${user.dir}/uploads

resume:
  storage-root: ${BDIS_RESUME_STORAGE_ROOT:${user.dir}/private-resumes}
  converter: ${BDIS_RESUME_CONVERTER:native}
  libreoffice-path: ${BDIS_LIBREOFFICE_PATH:soffice}
  docker-path: ${BDIS_DOCKER_PATH:docker}
  docker-image: ${BDIS_RESUME_DOCKER_IMAGE:bdis-docx-tools:ubuntu24.04}
  conversion-timeout-seconds: 30
  request-timeout-seconds: 120
  preview-minutes: 30
