#     # 改这里：把 你的数据库名 换成宝塔里你创建的数据库名字
#     # url: jdbc:mysql://localhost:3306/bdis_work?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
